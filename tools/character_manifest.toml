# at-rest pose, and a legless-blob entity elsewhere in this same pass
# (marumaru/child) already showed what asking for a walk cycle produces
# when the creature has nothing built for it -- see marumaru's own
# state_frames comment above. ayumaru DOES have legs, so its idle is a
# restless weight-shift and knee-bounce that never actually steps forward,
