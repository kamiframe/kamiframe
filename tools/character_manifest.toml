quirk = "Desperate to leave a mark and too nervous to try."
# Only "neutral" is animated -- see baby's state_frames comment (above,
# [stages.baby]) for why this is a state_frames entry, not `frames`. 9
# frames, ~10fps playback, a tight nervous breathing shiver that settles
