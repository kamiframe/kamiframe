# `object` is deliberately absent: the bible gives each teen a `read` and a
# behavioural line, but -- unlike the adults -- never states a source
# object for the juvenile stage itself (section 4 describes the *stage* as
# "the object after it's been cut into a tool but before it has done
# anything," not a specific object per family).
# ---------------------------------------------------------------------------

