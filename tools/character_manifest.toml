#
# The character manifest -- a declarative list of every sprite that needs to
# exist for the roster, and nothing else. This file has no logic in it; it
# is read by tools/kf_character_manifest.py, which is the only code that
# knows how to turn it into an actual list of sprites, prompts, or files.
#
# SOURCE OF TRUTH:
#   - 14-character-bible-v1.md                                    (the
#     roster, art direction, and the derivation rule -- referred to below as
#     "the bible")
#   - docs/superpowers/specs/2026-08-09-core-care-loop-design.md  (the five
#     code life-stages, the care states, and the 48x48 sprite size -- referred
#     to below as "the care-loop spec"; see its addendum for how the bible's
#     three stages map onto the code's five)
#   - docs/architecture/adr-0033-asset-pipeline.md                (the .kfpack
#     format this manifest ultimately feeds)
#
# NAME VERIFICATION WARNING (bible section 9): every character name in this
# file, without exception, is an unverified placeholder. `names_unverified`
# below is `true` for exactly that reason, and every entity also carries its
# own `name_verified = false`. Do not ship a name from this file without
# running it through the same trademark search the platform name went
# through -- the bible names two names it already expects to fail (Hamaru,
# Marumaru) and notes the whole -maru suffix is occupied by an existing
# prefectural mascot ecosystem.
#
# WHAT THIS FILE DOES NOT DECIDE:
#   - The creature *class* name (still open, bible section 12).
#   - Whether the two roster gaps (Cut needs one more, Go needs one or two
#     more -- bible section 11) get filled. Ten adults are listed because ten
#     are confirmed; the manifest does not pack bank/demoted concepts.
#   - Per-stage sprite size overrides. The care-loop spec says these are
#     *allowed* ("per-stage override allowed so an adult can carry more
#     presence than a baby") but gives no actual numbers, so every entity
#     below uses the 48x48 default and the override mechanism goes unused
#     until someone picks real values.
#   - What the "egg" and "baby" code stages look like. The bible does not
#     describe them at all (they predate the bible's three stages -- see the
#     care-loop spec's addendum), so those two entities below carry no
#     object/read/quirk text. See tools/kf_prompt_builder.py, which refuses
#     to invent one and prints a flag instead.

[meta]
schema_version = 1
bible_source = "14-character-bible-v1.md"
care_loop_source = "docs/superpowers/specs/2026-08-09-core-care-loop-design.md"
pack_format_source = "docs/architecture/adr-0033-asset-pipeline.md"
names_unverified = true

# Default sprite dimensions, in pixels. Care-loop spec section 9: "Creature
# sprite size: 48x48 as the base ... A multiple of 8, which suits the
# blitter." Overridable per entity with an entity-level `size = N`.
default_size = 48

# Default frame count per state. Overridable per entity with an
# entity-level `frames = N` (applies to every one of that entity's states --
# right for an entity with only one state, like the egg's "idle", wrong for
# an entity where only one of several poses is animated), or more precisely
# with an entity-level `state_frames = { state = N, ... }` table that
# overrides just the named state(s) and leaves every other state at its
# usual 1. See tools/kf_character_manifest.py's _state_frame_count() for
# the full reasoning -- introduced for the roster's first animation pass,
# where every creature but the egg keeps happy/objecting/sick/sleeping as
# single frames and animates only "neutral".
default_frames = 1

# The five care-loop states every entity gets by default (care-loop spec
# section 9: "creature expressions (happy, neutral, objecting, sick,
# sleeping)"; section 1 art direction: "Expression is carried by the body,
# not the face" -- these are five distinct POSES, not face swaps).
# Overridable per entity with an entity-level `states = [...]`; only the
# "egg" entity below uses that override, because the care-loop spec's own
# demand-curve table says the egg stage has no decay at all ("never"), so it
# has nothing to react to yet.
states = ["happy", "neutral", "objecting", "sick", "sleeping"]

# Shared juvenile ("teen") grammar, bible section 6, printed once here
# instead of copied into each of the four teens below -- the same "config
# lives in one place" instinct docs/superpowers/specs/2026-08-09-core-care-loop-design.md
# applies to its own demand-curve table.
juvenile_shared_grammar = "Perfectly symmetrical, one unbroken clean line, no marks anywhere, and one oversized feature that is exactly the thing that will wear down later. It over-performs its verb, because it has never done the job before."

# Bible section 3: how a grudge form differs from its normal form. Printed
# once and applied to every entity with grudge = true below, rather than
# repeated per creature.
#
# Restated in pixel-art terms for the same reason the house style was (see
# the DELIBERATE DEVIATION note in tools/kf_prompt_builder.py): the bible
# describes the grudge form as marker pressed too hard, which only means
# anything if the medium is a marker. What it is FOR -- the same creature,
# redrawn badly, turned away from you -- is unchanged.
grudge_grammar = "Same silhouette as the normal form, redrawn badly on purpose: the outline broken and uneven with stray loose pixels stranded along the edge, fills patchy and slightly off-register so the color does not sit properly inside the outline, eyes shrunk down to single pixels, body turned away from the viewer."

# ---------------------------------------------------------------------------
# Shared single designs. Bible section 4: baby (bible's own term, which the
# care-loop spec's addendum maps onto the CODE's "child" stage) is "1,
# shared by everything". The code's "egg" and "baby" stages sit BEFORE the
# bible's baby and are not described by the bible at all.
# ---------------------------------------------------------------------------

[stages.egg]
stage = "egg"
kind = "shared"
name_verified = false
states = ["idle"]  # see the file-level comment above: no decay, nothing to react to yet
# The egg's one state IS its animated idle, so the entity-wide override is
# unambiguous here (contrast baby/child/teens below, which need
# state_frames instead because only ONE of their several states animates).
# 9 frames, ~10fps playback (KF_ANIM_FRAME_MS) -- a subtle squash-and-stretch
# settle, generated 2026-08-09 via PixelLab animate_object v3 from source
# object ce666e73-338e-40ab-9e2d-7ef4c1e43efd. See
# .superpowers/sdd/first-animations-report.md for the generation record.
frames = 9
has_design_brief = true
object = "none yet -- unhatched"
read = "A small, chubby, round egg with its own understated surface markings -- soft speckles or a faint spiral, its own decoration rather than a blank shell -- while still not hinting at what's inside, because nothing has been decided yet at this stage."
quirk = "Does nothing. That is the whole of it."
note = "Chris, 2026-08-09: \"Go with a generic egg for now.\" Explicitly a placeholder -- the bible does not describe an egg, and this is not an attempt to invent one. Second pass, same day: the first generated egg was a plain pale blue shell with no pattern -- Chris asked for unique surface markings of its own. Still a placeholder shape and still no lore attached to the pattern."
render_note = "Draw (or, if generated larger, scale down and pad) so the egg occupies roughly one third of the 48x48 canvas, centred, with generous transparent margin on every side -- it should read as small within its frame, not edge-to-edge. The canvas itself stays 48x48; only the drawn creature shrinks."

[stages.baby]
stage = "baby"
kind = "shared"
name_verified = false
# states/size: inherit [meta] defaults (full 5 care states). frames stays
# the [meta] default of 1 for four of those five states -- only "neutral"
# (the pose visible at rest, the first animation pass's target) is
# animated, via state_frames below rather than the entity-wide `frames`
# override, which would wrongly ask for 9 frames of happy/objecting/sick/
# sleeping too. 9 frames, ~10fps playback, a calm floating breathing sway
# with one slow blink, generated 2026-08-09 via PixelLab animate_object v3
# from source object 4f84a1dd-62be-487c-8689-1f3fdbf1920c. See
# .superpowers/sdd/first-animations-report.md for the generation record.
state_frames = { neutral = 9 }
has_design_brief = true
object = "none yet -- not solid enough to hold one"
read = "A small, chubby drifting spirit wisp: a round, blobby body -- wide and soft, not tapered thin -- with no limbs and no ground contact, its underside rounding off into a soft blunt point rather than trailing to nothing or resting on anything. A vague, barely-there ghostly face -- two simple dark eye marks and a small open mouth, in the manga shorthand for a departed spirit rather than anything detailed or frightening."
quirk = "Needy and featureless. It cannot do anything yet, and mostly just wants."
note = "Chris, 2026-08-09: a generic spirit wisp with a vague ghostly face inspired by manga ghosts. Shared by every creature -- Marumaru at the CHILD stage is the first form that is actually its own thing. Second pass, same day: the first generation used PixelLab's create_character, whose default skeleton is humanoid and drew arms onto a brief that explicitly calls for none -- see docs/character-art-pipeline.md for the generator switch this forced. Chris also asked for the kawaii/chubby/blobby house style (see kf_prompt_builder.py's KAWAII_SHAPE_BLOCK) to replace the first pass's thinner, more Western-illustration look."

[stages.child]
stage = "child"
kind = "shared"
id = "marumaru"
display_name = "Marumaru"
name_verified = false
# Only "neutral" is animated -- see baby's state_frames comment above for
# why this is a state_frames entry and not the entity-wide `frames`
# override. 9 frames, ~10fps playback, a calm breathing settle with a
# slight tilt (no limbs to walk with -- an earlier spike asked this exact
# legless-lump entity for a walk cycle and it read as a barely-perceptible
# bob, which is why this pass asked for idle instead), generated
# 2026-08-09 via PixelLab animate_object v3 from source object
# 37f7629b-87fb-4ec6-871d-18ef0b28bce1 (an object that already carried two
# earlier, unused animation groups from that walk-cycle spike and an
# objecting-pose test -- neither is what this manifest entry names or
# points at). See .superpowers/sdd/first-animations-report.md.
state_frames = { neutral = 9 }
has_design_brief = true
object = "none yet -- an uncut blank"
read = "A smooth, featureless lump with a face. No teeth, no bristles, no edge -- object-shaped, but nothing has been made from it yet."
quirk = "Tries to do every job and can do none of them."
note = "The name is literally the Japanese fill-in-the-blank placeholder (equivalent to writing XXX on a form) -- bible section 5. Known trademark risk, accepted knowingly; if verification kills the name the concept survives under a different one."

# ---------------------------------------------------------------------------
# The death scene's scenery. NOT a creature life stage -- there is no
# KF_PET_STAGE_SHRINE, no evolution branch, nothing with a face. It is
# declared under the same [stages.X] table shape as egg/baby/child purely
# because the naming MECHANISM matches theirs: one code_token equal to the
# stage key, no branch indices, no [[teens]]/[[adults]] machinery --
# tools/kf_character_manifest.py's iter_sprites() picks this table up
# alongside egg/baby/child for exactly that reason (see its own comment).
# simulator/src/pet/kf_creature_screen.cpp looks this sprite up by the
# literal name "shrine_idle_s" (no frame-number suffix -- see that file's
# kShrineSpriteName), not through hakoniwaos/src/creature.cpp's
# kf_creature_sprite_name() -- a shrine is scenery, not a creature with a
# pose/direction to look up -- so it needs exactly one state and one
# direction, unlike every other entity in this file. The `directions`
# override below (new field, only this entity uses it) is what makes that
# possible without changing DIRECTIONS itself, which every real creature
# still needs all three of.
[stages.shrine]
stage = "shrine"
kind = "scenery"
name_verified = false
states = ["idle"]
directions = ["s"]  # scenery has no facings -- see the comment above
has_design_brief = true
object = "none -- this is scenery, not a creature derived from a source object the way the bible's derivation rule works for every other entity"
read = "A small roadside shrine, docs/superpowers/specs/2026-08-09-core-care-loop-design.md's own phrase: weathered wood and stone, a simple peaked roof over a modest base, one small offering (a cup, a flower, a coin) resting in front of it. Reads as remembrance and continuity, not a Western headstone or plot marker -- gentle, not somber."
quirk = "Sits still. There is nothing to react to -- it is the one sprite in the roster with no care-loop states at all."
note = "Chris, 2026-08-09 (via the core-care-loop spec): \"Shrine, not a gravestone ... it gives the eventual 'start a new egg' action somewhere natural to live -- you leave an offering rather than dig.\" Added in the second art-generation pass alongside marumaru (child) and hamaru (teen0) specifically because the screen code was already falling back to a placeholder rectangle without it."
render_note = "Same 48x48 canvas as every other creature sprite, centred, generous transparent margin -- kf_creature_screen.cpp centres whatever size this sprite actually is, so exact framing is a style choice, not a hard requirement, but 48x48 keeps it consistent with the rest of the roster and with the placeholder it replaces."

# The bedding for the optional tuck-in interaction. NOT a creature life
# stage -- there is no KF_PET_STAGE_FUTON, no evolution branch, nothing with
# a face of its own. Declared under the same [stages.X] table shape as the
# shrine above, and for the identical reason: the naming MECHANISM matches
# (one code_token equal to the stage key, no branch indices, no
# [[teens]]/[[adults]] machinery), so kf_character_manifest.py's
# iter_sprites() picks it up via SHARED_STAGE_KEYS. Looked up by the literal
# name "futon_idle_s", not through hakoniwaos/src/creature.cpp's
# kf_creature_sprite_name() -- bedding is scenery, not a creature with a
# pose/direction to resolve -- so like the shrine it needs exactly one state
# and one direction, via the `directions` override.
#
# ONE SPRITE FOR EVERY STAGE, ON PURPOSE. Chris, 2026-08-11, authorising the
# generation: "OK to generate a comfy looking japanese futon with a blob
# under it. Generic for now and generic enough that you can assume the small
# bit of head poking out is any of the characters so you don't need a
# generation per sprite." That is a cost decision as much as an art one -- a
# per-stage bedding set would be six more generations for a prop the
# creature is almost entirely hidden under. Do not add a {stage}_bed_{dir}
# family later without checking that decision still stands.
#
# THE WIGGLE AND THE ZZZ ARE NOT ART, and deliberately are not declared
# here. The futon wiggles by reusing the egg's integer triangle wave (a
# positional Y offset, simulator/src/pet/kf_creature_presenter.cpp) and the
# ZZZ is drawn as text from the built-in bitmap font, whose 'Z' at 0x5A is a
# real glyph and not one of the blank entries. Both cost zero generations,
# which is exactly why neither is a sprite.
[stages.futon]
stage = "futon"
kind = "scenery"
name_verified = false
states = ["idle"]
directions = ["s"]  # scenery has no facings -- see [stages.shrine]'s comment
has_design_brief = true
object = "none -- this is scenery, not a creature derived from a source object the way the bible's derivation rule works for every other entity"
read = "A Japanese futon laid directly on the floor -- no bed frame, no legs, no headboard, no raised base. A thin flat mattress pad with a plump puffy quilt over it and a small flat pillow at the head end. A small round creature sleeps underneath, and only the top of its head pokes out above the quilt: a smooth, near-featureless pale dome, so it reads as ANY creature in the roster rather than one of them. Cozy and inviting, not clinical."
quirk = "The one sprite in the roster that is deliberately ambiguous about who is in it. Every other entity is a specific creature; this has to work for all of them at once."
note = "Chris, 2026-08-11, authorising the art. Sleep itself is automatic -- the creature plops down where it stands and shows its own {stage}_sleeping_{dir} sprite -- so this futon is for the OPTIONAL tuck-in the care-loop spec's \"Sleep, settled\" section calls \"a nicety, not a duty\". Generated 2026-08-11; the first batch came back as Western beds with frames and headboards and nobody in them, and was rejected. See docs/architecture/adr-0049-sleep-on-screen.md."
render_note = "Same 48x48 canvas as every other sprite in this roster, centred, generous transparent margin. Generated with an existing *_sleeping_s sprite passed as a style reference, which is also what forced the 48x48 output size. 25 distinct colours, 912 fully-transparent pixels, no partial alpha -- which matters, because the pack format keys on a colour rather than carrying an alpha channel."

# ---------------------------------------------------------------------------
